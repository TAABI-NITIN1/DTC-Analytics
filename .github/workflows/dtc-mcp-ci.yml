name: DTC MCP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-contract-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.15
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: npm install --global @fission-ai/openspec@1.6.0
      - run: openspec validate dtc-analytics-mcp-v1 --strict --json
      - run: python -m compileall -q src tests scripts
      - run: git diff --check HEAD
      - run: python scripts/scan_secrets.py
      - run: python -m pytest tests/unit -q --cov=src.dtc_mcp --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - run: python -m pip_audit -r requirements-mcp.txt --progress-spinner off
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  clickhouse-integration-e2e:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8.28.1-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DTC_MCP_INTEGRATION: 1
      DEPLOYMENT_ENV: test
      DTC_DATA_ACCESS_MODE: mcp
      DTC_MCP_TRANSPORT: stdio
      DTC_MCP_TIMEOUT_SECONDS: 10
      DTC_MCP_CH_DB_Host: 127.0.0.1
      DTC_MCP_CH_DB_Port: 8123
      DTC_MCP_CH_DB_User: dtc_ci
      DTC_MCP_CH_DB_Password: test-only
      DTC_MCP_CH_DB_Database: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.15
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python scripts/setup_mcp_ci_clickhouse.py
      - run: python -m pytest tests/integration -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dtc-mcp
          push: false
          tags: dtc-mcp:ci
