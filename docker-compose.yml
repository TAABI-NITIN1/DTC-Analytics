services:
  dtc-analytics:
    build:
      context: .
      dockerfile: Dockerfile.dtc-analytics
    container_name: dtc-analytics
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8001:8001"
      - "5174:5174"
    environment:
      PYTHONPATH: /app
      DTC_MCP_URL: "http://dtc-mcp:8001/mcp"
      REDIS_URL: "redis://dtc-redis:6379/0"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.venv
      - /app/.git
      - frontend_node_modules:/app/frontend/node_modules
    networks:
      - default
      - dtc-internal
    restart: unless-stopped

  dtc-redis:
    image: redis:8.6.4-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dtc-internal
    restart: unless-stopped

  dtc-mcp:
    build:
      context: .
      dockerfile: Dockerfile.dtc-mcp
    env_file:
      - .env
    environment:
      DTC_MCP_TRANSPORT: "streamable_http"
      DTC_MCP_HOST: "0.0.0.0"
      DTC_MCP_PORT: "8001"
      DTC_MCP_AUTH_MODE: "signed_hmac"
      REDIS_URL: "redis://dtc-redis:6379/0"
      PYTHONPATH: /app
    expose:
      - "8001"
    depends_on:
      dtc-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - dtc-internal
      - dtc-egress
    restart: unless-stopped

  langsmith-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langsmith-sync-worker
    working_dir: /app
    env_file:
      - .env
    command: ["python", "run_langsmith_sync_worker.py"]
    environment:
      PYTHONPATH: /app
      LANGSMITH_SYNC_ENABLED: "1"
      LANGSMITH_SYNC_INTERVAL_SEC: "120"
      LANGSMITH_SYNC_LIMIT: "200"
      LANGSMITH_SYNC_LOOKBACK_DAYS: "14"
      LANGSMITH_SYNC_USE_CHECKPOINT: "1"
      LANGSMITH_SYNC_PIPELINE_KEY: "langsmith_root_runs"
      LANGSMITH_SYNC_SAFETY_LOOKBACK_MINUTES: "5"
      # Optional override. Falls back to LANGCHAIN_PROJECT/LANGSMITH_PROJECT when empty.
      LANGSMITH_SYNC_PROJECT: ""
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.venv
      - /app/.git
    restart: unless-stopped

volumes:
  frontend_node_modules:

networks:
  dtc-internal:
    internal: true
  dtc-egress:
